name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate ci-versions.json
        run: node test/validate-versions.js ci-versions.json
      - name: Run tests
        run: node test/test.js
      - name: Accessibility audit
        run: node test/a11y.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
